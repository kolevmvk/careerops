name: db

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main, develop]
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Replays every migration from zero, so a migration that only works
      # against a database that already exists fails here rather than in staging.
      - name: Start local stack and replay migrations
        run: pnpm supabase start

      - name: RLS and invariant tests
        run: pnpm supabase test db

      # The seed is the demo persona. If it stops applying, the public demo
      # instance and every screenshot taken from it are already broken.
      - name: Reset with demo seed
        run: pnpm supabase db reset

      # A table shipped without RLS is readable by anyone holding the anon key,
      # so this is a build failure rather than a review comment.
      - name: Assert row level security on every table
        run: |
          unprotected=$(docker exec supabase_db_CareerOps \
            psql -U postgres -d postgres -Atc \
            "select coalesce(string_agg(tablename, ', '), '') from pg_tables
              where schemaname = 'public' and not rowsecurity;")
          if [ -n "$unprotected" ]; then
            echo "::error::tables without row level security: $unprotected"
            exit 1
          fi
          echo "every public table has row level security enabled"

      - name: Stop local stack
        if: always()
        run: pnpm supabase stop --no-backup
