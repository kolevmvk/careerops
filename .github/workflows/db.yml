name: db

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local stack
        run: pnpm exec supabase start

      - name: Reset database (run all migrations)
        run: pnpm exec supabase db reset

      - name: pgTAP tests
        run: pnpm exec supabase test db

      - name: Lint schema
        run: pnpm exec supabase db lint --local --schema public --fail-on error

      - name: Stop Supabase local stack
        if: always()
        run: pnpm exec supabase stop
