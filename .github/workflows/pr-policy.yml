name: pr-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, so the title must be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject must start with a lowercase letter.
          # Dependabot titles ("Bump x from a to b") are generated and consistent; the type prefix is still enforced by its config.
          ignoreLabels: |
            dependencies

  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce branching model
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)
              case "$HEAD" in
                release/*|hotfix/*|release-please--*) ;;
                *) echo "::error::PRs into main must come from release/*, hotfix/* or release-please. Got: $HEAD"; exit 1 ;;
              esac ;;
            develop)
              case "$HEAD" in
                feature/*|fix/*|chore/*|docs/*|ci/*|refactor/*|test/*|dependabot/*|main|release/*|hotfix/*) ;;
                *) echo "::error::Branch name '$HEAD' does not follow the branching model (see CONTRIBUTING.md)."; exit 1 ;;
              esac ;;
            *)
              echo "::error::PRs must target develop or main. Got: $BASE"; exit 1 ;;
          esac
          echo "Branch policy OK: $HEAD -> $BASE"
