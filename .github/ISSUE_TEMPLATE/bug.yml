name: Bug
description: Something behaves differently than specified.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Include error output if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Reference the relevant section of docs/ if one applies.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, database, scoring, extraction, documents, ai, infra, ci]
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This report contains no real career data, secrets or personal information.
          required: true
